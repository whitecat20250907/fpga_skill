<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医学影像 · 交互演示</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e18;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#dce7f4}canvas{width:100%;height:100%;display:block}nav{position:fixed;bottom:22px;right:32px;display:flex;gap:8px}button{background:#192d43;color:#dce7f4;border:1px solid #45637d;border-radius:8px;padding:10px 16px;cursor:pointer}#status{position:fixed;bottom:22px;left:32px;color:#88a1b8;font-size:13px}</style>
<canvas id="view"></canvas><div id="status">连接模型中</div><nav><button data-a="demo_previous">←</button><button data-a="demo_next">→</button><button data-a="demo_zoom_out">−</button><button data-a="demo_zoom_in">＋</button><button data-a="demo_focus">聚焦</button><button data-a="demo_snap">吸附</button><button data-a="demo_reset">复位</button><button id="full">全屏</button></nav>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('consoleToken')||'';sessionStorage.setItem('consoleToken',token);history.replaceState(null,'',location.pathname);
const canvas=document.getElementById('view'),c=canvas.getContext('2d'),img=new Image();img.src='/medical.jpg';let state={demo:{slide:0,zoom:1,focus:false,snap:true},health:{}},lastPoll=0,manualUntil=0,raw=null,smooth=null,locked=null,candidate=null,since=0,lastFrame=0,lastSlide=-1,zoomAnchor=[.5,.5],previousZoom=1;
const targets=[{id:'A',name:'目标 A · 图像左侧区域',x:.30,y:.44,rx:.16,ry:.21},{id:'B',name:'目标 B · 图像右侧区域',x:.70,y:.44,rx:.16,ry:.21},{id:'C',name:'目标 C · 中央区域',x:.53,y:.65,rx:.14,ry:.15}];
async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Console-Token':token},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('连接失败');return r.json()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>api('action',{action:b.dataset.a}));document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen();
window.onkeydown=e=>{if(e.repeat)return;let a={ArrowRight:'demo_next',ArrowLeft:'demo_previous','+':'demo_zoom_in','=':'demo_zoom_in','-':'demo_zoom_out',f:'demo_focus',s:'demo_snap',r:'demo_reset'}[e.key];if(a){e.preventDefault();api('action',{action:a})}};
canvas.onpointermove=e=>{raw=[e.clientX,e.clientY];manualUntil=performance.now()+1800};canvas.onwheel=e=>{e.preventDefault();api('action',{action:e.deltaY<0?'demo_zoom_in':'demo_zoom_out'})};
async function poll(){try{state=await api('state');lastPoll=performance.now()}catch(e){state.health={error:e.message};raw=null}finally{setTimeout(poll,100)}}poll();
function draw(now){let w=innerWidth,h=innerHeight,dpr=devicePixelRatio;if(canvas.width!==w*dpr||canvas.height!==h*dpr){canvas.width=w*dpr;canvas.height=h*dpr}c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#080e18';c.fillRect(0,0,w,h);let d=state.demo,g=state.health.filtered_gaze,reg=(state.health.registrations||[]).find(x=>x.slot===state.health.actor_slot&&x.tracking_state==='active');let fresh=now-lastPoll<500&&g?.valid&&g.projection_valid&&g.calibration_valid_for_track&&g.track_id===reg?.face_track_id&&g.source_instance===reg?.face_source_instance;
if(now>manualUntil)raw=fresh?[g.filtered[0]/g.screen_size[0]*w,g.filtered[1]/g.screen_size[1]*h]:null;
if(d.slide!==lastSlide){locked=candidate=null;smooth=null;zoomAnchor=[.5,.5];lastSlide=d.slide}
let dt=Math.min(.1,(now-lastFrame)/1000);lastFrame=now;if(raw){let a=1-Math.exp(-dt/.09);smooth=smooth?smooth.map((v,i)=>v+(raw[i]-v)*a):raw.slice()}else{smooth=null;locked=candidate=null}
const baseH=h*.78,baseW=baseH*1929/2207,left=w*.32+(w*.64-baseW)/2,top=h*.10;
if(d.zoom!==previousZoom){if(smooth)zoomAnchor=[Math.max(0,Math.min(1,(smooth[0]-left)/baseW)),Math.max(0,Math.min(1,(smooth[1]-top)/baseH))];previousZoom=d.zoom}
const iw=baseW*d.zoom,ih=baseH*d.zoom,ix=left-(iw-baseW)*zoomAnchor[0],iy=top-(ih-baseH)*zoomAnchor[1];
let shown=targets.map(t=>({...t,px:ix+t.x*iw,py:iy+t.y*ih,rxp:t.rx*iw,ryp:t.ry*ih})).filter(t=>t.px>=w*.34&&t.px<=w*.97&&t.py>=top&&t.py<=top+baseH);
if(smooth&&d.snap&&d.slide===2){let dist=t=>Math.hypot((smooth[0]-t.px)/Math.min(130,t.rxp),(smooth[1]-t.py)/Math.min(110,t.ryp));let old=shown.find(t=>t.id===locked);if(!old||dist(old)>1.45)locked=null;let best=shown.filter(t=>dist(t)<=1).sort((a,b)=>dist(a)-dist(b))[0];if(!locked){if(best?.id!==candidate){candidate=best?.id;since=now}if(candidate&&now-since>=220)locked=candidate}}else{locked=candidate=null}
c.fillStyle='#69e4c3';c.font=`600 ${Math.max(12,w*.011)}px sans-serif`;c.fillText('医学影像 · 无接触交互',w*.04,h*.11);c.fillStyle='#e3edf7';c.font=`600 ${Math.max(24,w*.029)}px sans-serif`;const titles=['用视线定位','放大并聚焦','让光标吸附目标'];c.fillText(titles[d.slide],w*.04,h*.22);c.font=`${Math.max(14,w*.013)}px sans-serif`;c.fillStyle='#9db0c5';const lines=[['先完成个人标定','移动视线，观察光标位置','画 L 放大，反 L 缩小'],['凝视感兴趣的位置','画 L：围绕当前位置放大','画 M：开启或关闭聚焦'],['目标来自这张图的区域','凝视目标，稳定后吸附','画 W：切换吸附开关']][d.slide];lines.forEach((s,i)=>c.fillText(s,w*.04,h*(.33+i*.055)));c.fillStyle='#69e4c3';c.fillText(`${d.slide+1} / 3     ${d.zoom.toFixed(2)}×`,w*.04,h*.60);c.fillStyle='#728ca5';c.font=`${Math.max(11,w*.009)}px sans-serif`;c.fillText('公开教学影像 · 区域标记仅用于交互演示',w*.04,h*.69);c.fillText('Mikael Häggström · Wikimedia Commons · CC0',w*.04,h*.73);
c.save();c.beginPath();c.rect(w*.34,top,w*.63,baseH);c.clip();if(img.complete&&img.naturalWidth)c.drawImage(img,ix,iy,iw,ih);if(d.slide===2){for(let t of shown){c.strokeStyle=t.id===locked?'#69e4c3':'#b0d2dd88';c.lineWidth=t.id===locked?4:2;c.beginPath();c.ellipse(t.px,t.py,t.rxp,t.ryp,0,0,Math.PI*2);c.stroke();c.fillStyle='#69e4c3';c.font='bold 22px sans-serif';c.fillText(t.id,t.px,t.py)}}c.restore();
const target=shown.find(t=>t.id===locked),point=target?[target.px,target.py]:smooth;if(point){if(d.focus){c.save();c.fillStyle='#080e18cc';c.beginPath();c.rect(w*.34,top,w*.63,baseH);c.arc(point[0],point[1],Math.min(w,h)*.13,0,Math.PI*2,true);c.fill('evenodd');c.restore()}c.strokeStyle=target?'#69e4c3':'#ffcc81';c.lineWidth=2;c.beginPath();c.arc(point[0],point[1],14,0,Math.PI*2);c.moveTo(point[0]-22,point[1]);c.lineTo(point[0]+22,point[1]);c.moveTo(point[0],point[1]-22);c.lineTo(point[0],point[1]+22);c.stroke()}
document.getElementById('status').textContent=(now<manualUntil?'电脑鼠标预览':fresh?'实时眼动':'等待当前人物完成标定')+' · '+(target?'已吸附 '+target.id:'自由定位')+' · '+(d.focus?'聚焦开启':'聚焦关闭');requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
